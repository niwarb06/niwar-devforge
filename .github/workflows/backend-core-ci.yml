name: Backend Core CI

on:
  push:
    paths:
      - "packages/backend-core/**"
      - ".github/workflows/backend-core-ci.yml"
  pull_request:
    paths:
      - "packages/backend-core/**"
      - ".github/workflows/backend-core-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devforge
          POSTGRES_USER: devforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devforge -d devforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: valkey/valkey:7.2.14-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: packages/backend-core

    env:
      DEVFORGE_ENVIRONMENT: test
      DEVFORGE_DATABASE_URL: postgresql+psycopg://devforge@127.0.0.1:5432/devforge
      DEVFORGE_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install backend core
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src/devforge_core

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: OpenAPI export
        run: |
          python scripts/export_openapi.py --output /tmp/devforge-openapi.json
          python -c 'import json; s=json.load(open("/tmp/devforge-openapi.json")); assert s["openapi"]; assert s["info"]["title"]'

      - name: TypeScript contract generation proof
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npx --yes --package=openapi-typescript@7.13.0 openapi-typescript \
            /tmp/devforge-openapi.json -o /tmp/devforge-openapi.d.ts
          grep -q 'UserProfileResponse' /tmp/devforge-openapi.d.ts
          grep -q 'SessionResponse' /tmp/devforge-openapi.d.ts
          grep -q '"/api/v1/users/me"' /tmp/devforge-openapi.d.ts
          grep -q '"/api/v1/auth/register"' /tmp/devforge-openapi.d.ts
          grep -q '"/api/v1/auth/session"' /tmp/devforge-openapi.d.ts

      - name: Tests
        run: pytest --cov=devforge_core --cov-report=term-missing
