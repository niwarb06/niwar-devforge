name: Backend Core CI

on:
  push:
    paths:
      - "packages/backend-core/**"
      - ".github/workflows/backend-core-ci.yml"
  pull_request:
    paths:
      - "packages/backend-core/**"
      - ".github/workflows/backend-core-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devforge
          POSTGRES_USER: devforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devforge -d devforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: packages/backend-core

    env:
      DEVFORGE_ENVIRONMENT: test
      DEVFORGE_DATABASE_URL: postgresql+psycopg://devforge@127.0.0.1:5432/devforge
      DEVFORGE_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend core
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src/devforge_core

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: OpenAPI export
        run: |
          python scripts/export_openapi.py --output /tmp/devforge-openapi.json
          python -c 'import json; s=json.load(open("/tmp/devforge-openapi.json")); assert s["openapi"]; assert s["info"]["title"]'

      - name: Tests
        run: pytest --cov=devforge_core --cov-report=term-missing
