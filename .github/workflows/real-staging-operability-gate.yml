name: Real Staging Operability Gate

on:
  pull_request:
    paths:
      - ".github/workflows/real-staging-operability-gate.yml"
      - "infrastructure/staging/observability/**"
      - "infrastructure/staging/scripts/**"
      - "infrastructure/staging/systemd/**"
      - "infrastructure/staging/OPERABILITY.md"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character commit SHA already reachable from main"
        required: true
        type: string
      release_dir:
        description: "Existing real staging release directory created by the release gate"
        required: true
        type: string
      confirm:
        description: "Type VERIFY-STAGING-OPERABILITY"
        required: true
        type: string

permissions:
  contents: read

jobs:
  operability-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate operability gate files
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          RELEASE_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.release_dir || '/srv/niwar-devforge/staging/releases/pr-validation' }}
          CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || 'PR-VALIDATION' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m compileall -q infrastructure/staging/observability infrastructure/staging/scripts infrastructure/staging/tests
          bash -n infrastructure/staging/scripts/*.sh
          python -m unittest discover -s infrastructure/staging/tests -p 'test_*.py' -v

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$CONFIRM" = "VERIFY-STAGING-OPERABILITY"
            [[ "$RELEASE_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
            [[ "$RELEASE_DIR" != *"/../"* ]]
            [[ "$RELEASE_DIR" != *"/.." ]]
            git fetch origin main
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          fi

  verify-real-staging-operability:
    if: github.event_name == 'workflow_dispatch'
    needs: operability-contract
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_DIR: ${{ inputs.release_dir }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_ALERT_WEBHOOK_URL: ${{ secrets.STAGING_ALERT_WEBHOOK_URL }}
      STAGING_ALERT_WEBHOOK_BEARER: ${{ secrets.STAGING_ALERT_WEBHOOK_BEARER }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fail closed on real-host inputs
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?configure staging variable STAGING_HOST}"
          : "${STAGING_SSH_HOST:?configure staging variable STAGING_SSH_HOST}"
          : "${STAGING_SSH_USER:?configure staging variable STAGING_SSH_USER}"
          : "${STAGING_SSH_PRIVATE_KEY:?configure staging secret STAGING_SSH_PRIVATE_KEY}"
          : "${STAGING_SSH_KNOWN_HOSTS:?configure staging secret STAGING_SSH_KNOWN_HOSTS}"
          : "${STAGING_ALERT_WEBHOOK_URL:?configure staging secret STAGING_ALERT_WEBHOOK_URL}"
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          ssh_port="${STAGING_SSH_PORT:-22}"
          [[ "$ssh_port" =~ ^[0-9]+$ ]]
          test "$ssh_port" -ge 1
          test "$ssh_port" -le 65535

      - name: Verify real public health from an external runner
        env:
          ORIGIN: https://${{ vars.STAGING_HOST }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          env -u STAGING_ALERT_WEBHOOK_URL -u STAGING_ALERT_WEBHOOK_BEARER \
            python infrastructure/staging/observability/staging_monitor.py \
              --origin "$ORIGIN" \
              --state-file "$tmp/state.json" \
              --event-log "$tmp/events.jsonl" \
              --once

      - name: Demonstrate real external alert delivery
        env:
          ORIGIN: https://${{ vars.STAGING_HOST }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python infrastructure/staging/observability/staging_monitor.py \
            --origin "$ORIGIN" \
            --state-file "$tmp/state.json" \
            --event-log "$tmp/events.jsonl" \
            --alert-drill

      - name: Prepare verified SSH trust
        id: ssh
        run: |
          set -euo pipefail
          ssh_port="${STAGING_SSH_PORT:-22}"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/devforge_staging"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/devforge_staging" "$HOME/.ssh/known_hosts"
          printf 'port=%s\n' "$ssh_port" >> "$GITHUB_OUTPUT"

      - name: Verify persistent monitor service and record immutable release metadata
        env:
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          ssh_args=(
            -i "$HOME/.ssh/devforge_staging"
            -p "$SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          target="$STAGING_SSH_USER@$STAGING_SSH_HOST"

          ssh "${ssh_args[@]}" "$target" "
            set -euo pipefail
            test -d '$RELEASE_DIR'
            cd '$RELEASE_DIR'
            test -f release.env
            systemctl is-active --quiet niwar-devforge-staging-monitor.service
            set -a
            . ./release.env
            set +a
            bash infrastructure/staging/scripts/record-release-meta.sh \
              ./release.env \
              ./release.meta.json \
              '$SOURCE_SHA' \
              \"\$STAGING_BACKEND_IMAGE\" \
              \"\$STAGING_WEB_IMAGE\" \
              '$GITHUB_RUN_ID'
            python3 infrastructure/staging/scripts/release_guard.py validate --path ./release.meta.json
          "

      - name: Prove bounded external log retrieval without publishing log contents
        env:
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          ssh_args=(
            -i "$HOME/.ssh/devforge_staging"
            -p "$SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          target="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          ssh "${ssh_args[@]}" "$target" "
            set -euo pipefail
            cd '$RELEASE_DIR'
            docker compose --env-file release.env -f infrastructure/staging/compose.yml \
              logs --since 10m --no-color caddy web backend
          " > "$log_file"
          test -s "$log_file"
          line_count="$(wc -l < "$log_file" | tr -d ' ')"
          digest="$(sha256sum "$log_file" | awk '{print $1}')"
          echo "Retrieved $line_count bounded staging log lines; SHA-256 $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Record operability evidence summary
        run: |
          {
            echo '## Real staging operability evidence'
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Release directory: \`$RELEASE_DIR\`"
            echo "- Public origin: \`https://$STAGING_HOST\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo '- External public/auth-path health: PASS'
            echo '- External alert delivery drill: PASS'
            echo '- Persistent host monitor service active: PASS'
            echo '- Immutable release metadata recorded/validated: PASS'
            echo '- Bounded application/ingress log retrieval: PASS'
            echo
            echo 'A two-release rollback drill and long-term/centralized log-retention evidence remain separate Production Candidate gates.'
          } >> "$GITHUB_STEP_SUMMARY"
