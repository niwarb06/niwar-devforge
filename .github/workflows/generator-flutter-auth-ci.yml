name: Generator Flutter Auth CI

on:
  push:
    paths:
      - "generator/**"
      - "packages/backend-core/**"
      - "packages/flutter-auth-core/**"
      - ".github/workflows/generator-flutter-auth-ci.yml"
  pull_request:
    paths:
      - "generator/**"
      - "packages/backend-core/**"
      - "packages/flutter-auth-core/**"
      - ".github/workflows/generator-flutter-auth-ci.yml"

permissions:
  contents: read

jobs:
  generated-flutter-auth:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devforge
          POSTGRES_USER: devforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devforge -d devforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: valkey/valkey:7.2.14-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DEVFORGE_ENVIRONMENT: test
      DEVFORGE_DATABASE_URL: postgresql+psycopg://devforge@127.0.0.1:5432/devforge
      DEVFORGE_REDIS_URL: redis://127.0.0.1:6379/0
      DEVFORGE_REAL_BACKEND_URL: http://127.0.0.1:8000/api/v1/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          node --version
          python --version
          flutter --version

      - name: Generator unit tests
        run: node --test generator/tests/*.test.mjs

      - name: Validate reusable Flutter auth core
        working-directory: packages/flutter-auth-core
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test

      - name: Install real backend core
        working-directory: packages/backend-core
        run: pip install -e .

      - name: Apply backend migrations
        working-directory: packages/backend-core
        run: alembic upgrade head

      - name: Generate Flutter product twice
        run: |
          rm -rf .generated
          node generator/generate.mjs \
            --manifest generator/manifests/flutter-auth-proof.json \
            --output .generated/flutter-first
          node generator/generate.mjs \
            --manifest generator/manifests/flutter-auth-proof.json \
            --output .generated/flutter-second

      - name: Prove deterministic Flutter output
        run: diff -ru .generated/flutter-first .generated/flutter-second

      - name: Resolve generated Flutter dependencies
        working-directory: .generated/flutter-first
        run: flutter pub get

      - name: Format generated Flutter product
        working-directory: .generated/flutter-first
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze generated Flutter product
        working-directory: .generated/flutter-first
        run: flutter analyze

      - name: Generated Flutter widget E2E
        working-directory: .generated/flutter-first
        run: flutter test test/auth_screen_test.dart --reporter expanded

      - name: Build generated product in Android host runner
        run: |
          flutter create \
            --platforms=android \
            --project-name=generated_mobile_auth_host \
            --org=com.niwar.devforge \
            .generated/android-host
          rm -rf .generated/android-host/lib .generated/android-host/test
          cp -R .generated/flutter-first/lib .generated/android-host/lib
          cp -R .generated/flutter-first/test .generated/android-host/test
          cp .generated/flutter-first/pubspec.yaml .generated/android-host/pubspec.yaml
          cp .generated/flutter-first/analysis_options.yaml .generated/android-host/analysis_options.yaml
          cd .generated/android-host
          flutter pub get
          flutter analyze lib
          flutter build apk --debug
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Start real backend
        run: |
          nohup python -m uvicorn devforge_core.main:app --host 127.0.0.1 --port 8000 > .generated/backend.log 2>&1 &
          echo $! > .generated/backend.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/live >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              cat .generated/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Generated Flutter real-backend auth E2E
        working-directory: .generated/flutter-first
        run: flutter test test/real_backend_test.dart --reporter expanded

      - name: Stop runtime backend
        if: always()
        run: |
          if [ -f .generated/backend.pid ]; then kill "$(cat .generated/backend.pid)" || true; fi


  generated-flutter-auth-android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          node --version
          flutter --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Generate Flutter product
        run: |
          rm -rf .generated
          node generator/generate.mjs \
            --manifest generator/manifests/flutter-auth-proof.json \
            --output .generated/flutter-first

      - name: Build generated product in Android emulator host
        run: |
          flutter create \
            --platforms=android \
            --project-name=generated_mobile_auth_host \
            --org=com.niwar.devforge \
            .generated/android-emulator-host
          rm -rf .generated/android-emulator-host/lib .generated/android-emulator-host/test
          cp -R .generated/flutter-first/lib .generated/android-emulator-host/lib
          cp -R .generated/flutter-first/test .generated/android-emulator-host/test
          cp .generated/flutter-first/pubspec.yaml .generated/android-emulator-host/pubspec.yaml
          cp .generated/flutter-first/analysis_options.yaml .generated/android-emulator-host/analysis_options.yaml
          mkdir -p .generated/android-emulator-host/integration_test
          cp packages/flutter-auth-core/integration_test/secure_storage_integration_test.dart \
            .generated/android-emulator-host/integration_test/secure_storage_integration_test.dart
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('.generated/android-emulator-host/pubspec.yaml')
          text = pubspec.read_text()
          needle = 'dev_dependencies:\n  flutter_test:\n    sdk: flutter\n'
          replacement = needle + '  integration_test:\n    sdk: flutter\n'
          if needle not in text:
              raise SystemExit('expected Flutter dev_dependencies block not found')
          pubspec.write_text(text.replace(needle, replacement, 1))
          PY
          cd .generated/android-emulator-host
          flutter pub get
          dart format --output=none --set-exit-if-changed integration_test
          flutter analyze lib integration_test
          flutter build apk --debug
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Boot Android emulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          emulator="$ANDROID_SDK_ROOT/emulator/emulator"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$sdkmanager"
          test -x "$avdmanager"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$sdkmanager" --install \
            "emulator" \
            "platform-tools" \
            "system-images;android-35;google_apis;x86_64"
          test -x "$adb"
          printf 'no\n' | "$avdmanager" create avd \
            --force \
            --name devforge_api_35 \
            --package "system-images;android-35;google_apis;x86_64"
          nohup "$emulator" \
            -avd devforge_api_35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -wipe-data \
            > .generated/android-emulator.log 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > .generated/android-emulator.pid

          for attempt in $(seq 1 180); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator process exited before boot completed."
              cat .generated/android-emulator.log
              exit 1
            fi

            device_id="$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ {print $1; exit}')"
            if [ -n "$device_id" ]; then
              boot="$("$adb" -s "$device_id" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot" = "1" ]; then
                "$adb" -s "$device_id" shell input keyevent 82 || true
                "$adb" devices
                exit 0
              fi
            fi

            sleep 2
          done

          echo "Android emulator did not complete boot within the bounded polling window."
          cat .generated/android-emulator.log
          exit 1

      - name: Run Android Emulator secure-storage integration proof
        working-directory: .generated/android-emulator-host
        timeout-minutes: 10
        run: |
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$adb"
          DEVICE_ID="$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ {print $1; exit}')"
          test -n "$DEVICE_ID"
          flutter devices
          flutter test integration_test/secure_storage_integration_test.dart \
            -d "$DEVICE_ID" \
            --reporter expanded

      - name: Stop Android emulator
        if: always()
        run: |
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          if [ -x "$adb" ]; then
            DEVICE_ID="$("$adb" devices | awk 'NR > 1 && $1 ~ /^emulator-/ {print $1; exit}')"
            if [ -n "$DEVICE_ID" ]; then
              "$adb" -s "$DEVICE_ID" emu kill || true
            fi
          fi

  generated-flutter-auth-ios-simulator:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          node --version
          flutter --version
          xcodebuild -version

      - name: Generate Flutter product
        run: |
          rm -rf .generated
          node generator/generate.mjs \
            --manifest generator/manifests/flutter-auth-proof.json \
            --output .generated/flutter-first

      - name: Build generated product in iOS simulator host
        run: |
          flutter create \
            --platforms=ios \
            --project-name=generated_mobile_auth_host \
            --org=com.niwar.devforge \
            .generated/ios-host
          rm -rf .generated/ios-host/lib .generated/ios-host/test
          cp -R .generated/flutter-first/lib .generated/ios-host/lib
          cp -R .generated/flutter-first/test .generated/ios-host/test
          cp .generated/flutter-first/pubspec.yaml .generated/ios-host/pubspec.yaml
          cp .generated/flutter-first/analysis_options.yaml .generated/ios-host/analysis_options.yaml
          mkdir -p .generated/ios-host/integration_test
          cp packages/flutter-auth-core/integration_test/secure_storage_integration_test.dart \
            .generated/ios-host/integration_test/secure_storage_integration_test.dart
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('.generated/ios-host/pubspec.yaml')
          text = pubspec.read_text()
          needle = 'dev_dependencies:\n  flutter_test:\n    sdk: flutter\n'
          replacement = needle + '  integration_test:\n    sdk: flutter\n'
          if needle not in text:
              raise SystemExit('expected Flutter dev_dependencies block not found')
          pubspec.write_text(text.replace(needle, replacement, 1))
          PY
          cd .generated/ios-host
          flutter pub get
          dart format --output=none --set-exit-if-changed integration_test
          flutter analyze lib integration_test
          flutter build ios --simulator --debug
          test -d build/ios/iphonesimulator/Runner.app

      - name: Run iOS Simulator secure-storage integration proof
        working-directory: .generated/ios-host
        timeout-minutes: 10
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          flutter test integration_test/secure_storage_integration_test.dart \
            -d "$DEVICE_UDID" \
            --reporter expanded
