name: Dating Social Pack Contract CI

on:
  push:
    paths:
      - "packs/dating-social/**"
      - ".github/workflows/dating-social-pack-contract-ci.yml"
  pull_request:
    paths:
      - "packs/dating-social/**"
      - ".github/workflows/dating-social-pack-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-dating-social-pack-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate dating social pack contract
        run: python packs/dating-social/validate_dating_social_pack_contract.py
      - name: Run dating social pack unit tests
        run: python -m unittest discover -s packs/dating-social/tests -p "test_*.py"
