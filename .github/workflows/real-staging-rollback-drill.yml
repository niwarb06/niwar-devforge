name: Real Staging Rollback Drill

on:
  pull_request:
    paths:
      - ".github/workflows/real-staging-rollback-drill.yml"
      - "infrastructure/staging/staging-auth-smoke.mjs"
      - "infrastructure/staging/scripts/**"
      - "infrastructure/staging/OPERABILITY.md"
  workflow_dispatch:
    inputs:
      current_source_sha:
        description: "Exact current 40-character commit SHA already reachable from main"
        required: true
        type: string
      current_release_dir:
        description: "Current known-good staging release directory"
        required: true
        type: string
      previous_release_dir:
        description: "Previous known-good staging release directory"
        required: true
        type: string
      confirm:
        description: "Type RUN-STAGING-ROLLBACK-DRILL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: niwar-devforge-real-staging
  cancel-in-progress: false

jobs:
  rollback-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.current_source_sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate rollback-drill files
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.current_source_sha || github.sha }}
          CURRENT_RELEASE_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.current_release_dir || '/srv/niwar-devforge/staging/releases/current-validation' }}
          PREVIOUS_RELEASE_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_release_dir || '/srv/niwar-devforge/staging/releases/previous-validation' }}
          CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || 'PR-VALIDATION' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash -n infrastructure/staging/scripts/*.sh
          python -m compileall -q infrastructure/staging/scripts infrastructure/staging/observability infrastructure/staging/tests
          node --check infrastructure/staging/staging-auth-smoke.mjs
          python -m unittest discover -s infrastructure/staging/tests -p 'test_*.py' -v

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$CONFIRM" = "RUN-STAGING-ROLLBACK-DRILL"
            for path in "$CURRENT_RELEASE_DIR" "$PREVIOUS_RELEASE_DIR"; do
              [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
              [[ "$path" != *"/../"* ]]
              [[ "$path" != *"/.." ]]
            done
            test "$CURRENT_RELEASE_DIR" != "$PREVIOUS_RELEASE_DIR"
            git fetch origin main
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          fi

  real-rollback-drill:
    if: github.event_name == 'workflow_dispatch'
    needs: rollback-contract
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    env:
      SOURCE_SHA: ${{ inputs.current_source_sha }}
      CURRENT_RELEASE_DIR: ${{ inputs.current_release_dir }}
      PREVIOUS_RELEASE_DIR: ${{ inputs.previous_release_dir }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      STAGING_BACKUP_DIR: ${{ vars.STAGING_BACKUP_DIR }}
      STAGING_GHCR_USER: ${{ secrets.STAGING_GHCR_USER }}
      STAGING_GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.current_source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Fail closed on staging drill inputs
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?configure staging variable STAGING_HOST}"
          : "${STAGING_SSH_HOST:?configure staging variable STAGING_SSH_HOST}"
          : "${STAGING_SSH_USER:?configure staging variable STAGING_SSH_USER}"
          : "${STAGING_BACKUP_DIR:?configure staging variable STAGING_BACKUP_DIR}"
          : "${STAGING_GHCR_USER:?configure staging secret STAGING_GHCR_USER}"
          : "${STAGING_GHCR_TOKEN:?configure staging secret STAGING_GHCR_TOKEN}"
          : "${STAGING_SSH_PRIVATE_KEY:?configure staging secret STAGING_SSH_PRIVATE_KEY}"
          : "${STAGING_SSH_KNOWN_HOSTS:?configure staging secret STAGING_SSH_KNOWN_HOSTS}"
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$STAGING_GHCR_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$STAGING_BACKUP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$STAGING_BACKUP_DIR" != *"/../"* ]]
          [[ "$STAGING_BACKUP_DIR" != *"/.." ]]

      - name: Prepare verified SSH trust
        id: ssh
        run: |
          set -euo pipefail
          ssh_port="${STAGING_SSH_PORT:-22}"
          [[ "$ssh_port" =~ ^[0-9]+$ ]]
          test "$ssh_port" -ge 1
          test "$ssh_port" -le 65535
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/devforge_staging"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/devforge_staging" "$HOME/.ssh/known_hosts"
          printf 'port=%s\n' "$ssh_port" >> "$GITHUB_OUTPUT"

      - name: Validate current and previous immutable release records
        env:
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          ssh_args=(
            -i "$HOME/.ssh/devforge_staging"
            -p "$SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          target="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          ssh "${ssh_args[@]}" "$target" "
            set -euo pipefail
            test -f '$CURRENT_RELEASE_DIR/release.env'
            test -f '$CURRENT_RELEASE_DIR/release.meta.json'
            test -f '$PREVIOUS_RELEASE_DIR/release.env'
            test -f '$PREVIOUS_RELEASE_DIR/release.meta.json'
            cd '$CURRENT_RELEASE_DIR'
            python3 infrastructure/staging/scripts/release_guard.py validate --path ./release.meta.json
            python3 infrastructure/staging/scripts/release_guard.py assert-source \
              --path ./release.meta.json \
              --source-sha '$SOURCE_SHA'
            python3 infrastructure/staging/scripts/release_guard.py validate \
              --path '$PREVIOUS_RELEASE_DIR/release.meta.json'
          "

      - name: Install audited rollback browser harness
        run: |
          set -euo pipefail
          rm -rf .rollback-browser-harness
          mkdir .rollback-browser-harness
          cd .rollback-browser-harness
          npm init -y >/dev/null
          npm install --save-exact playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium

      - name: Roll back to previous known-good application images
        id: rollback
        env:
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          ssh_args=(
            -i "$HOME/.ssh/devforge_staging"
            -p "$SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          target="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          printf '%s' "$STAGING_GHCR_TOKEN" | ssh "${ssh_args[@]}" "$target" "
            set -euo pipefail
            cd '$CURRENT_RELEASE_DIR'
            bash infrastructure/staging/scripts/rollback-release.sh \
              '$PREVIOUS_RELEASE_DIR/release.env' \
              '$PREVIOUS_RELEASE_DIR/release.meta.json' \
              '$STAGING_BACKUP_DIR' \
              '$STAGING_GHCR_USER'
          "
          echo 'performed=true' >> "$GITHUB_OUTPUT"

      - name: Prove auth flow after rollback
        working-directory: .rollback-browser-harness
        env:
          DEVFORGE_STAGING_ORIGIN: https://${{ vars.STAGING_HOST }}
        run: node ../infrastructure/staging/staging-auth-smoke.mjs

      - name: Forward-restore current known-good application images
        id: restore
        if: always() && steps.rollback.outputs.performed == 'true'
        env:
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          ssh_args=(
            -i "$HOME/.ssh/devforge_staging"
            -p "$SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          target="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          printf '%s' "$STAGING_GHCR_TOKEN" | ssh "${ssh_args[@]}" "$target" "
            set -euo pipefail
            cd '$CURRENT_RELEASE_DIR'
            bash infrastructure/staging/scripts/deploy-release.sh \
              ./release.env \
              '$STAGING_BACKUP_DIR' \
              '$STAGING_GHCR_USER'
          "

      - name: Prove auth flow after forward restore
        if: steps.restore.outcome == 'success'
        working-directory: .rollback-browser-harness
        env:
          DEVFORGE_STAGING_ORIGIN: https://${{ vars.STAGING_HOST }}
        run: node ../infrastructure/staging/staging-auth-smoke.mjs

      - name: Record rollback-drill evidence
        if: steps.restore.outcome == 'success'
        run: |
          {
            echo '## Real staging rollback drill evidence'
            echo
            echo "- Current source SHA: \`$SOURCE_SHA\`"
            echo "- Current release: \`$CURRENT_RELEASE_DIR\`"
            echo "- Previous release: \`$PREVIOUS_RELEASE_DIR\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo '- Previous release metadata: VALID'
            echo '- Exact database schema compatibility before rollback: PASS'
            echo '- Fresh pre-rollback backup: PASS'
            echo '- Previous immutable application images: HEALTHY + AUTH SMOKE PASS'
            echo '- Forward restore current immutable application images: HEALTHY + AUTH SMOKE PASS'
            echo
            echo 'No database downgrade or infrastructure rollback was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
