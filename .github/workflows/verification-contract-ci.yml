name: Verification Contract CI

on:
  push:
    paths:
      - "packages/verification/**"
      - ".github/workflows/verification-contract-ci.yml"
  pull_request:
    paths:
      - "packages/verification/**"
      - ".github/workflows/verification-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-verification-contract:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate verification contract
        run: python packages/verification/validate_verification_contract.py

      - name: Run verification unit tests
        run: python -m unittest discover -s packages/verification/tests -p "test_*.py"
