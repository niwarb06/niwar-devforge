name: Pilot Proof Evidence CI

on:
  push:
    paths:
      - "docs/13_PILOT_PROOF_METRICS.md"
      - "docs/evidence/pilot-proof-metrics.json"
      - "generator/manifests/web-auth-proof.json"
      - "generator/manifests/flutter-auth-proof.json"
      - "scripts/verify_pilot_proof_metrics.py"
      - ".github/workflows/pilot-proof-evidence-ci.yml"
  pull_request:
    paths:
      - "docs/13_PILOT_PROOF_METRICS.md"
      - "docs/evidence/pilot-proof-metrics.json"
      - "generator/manifests/web-auth-proof.json"
      - "generator/manifests/flutter-auth-proof.json"
      - "scripts/verify_pilot_proof_metrics.py"
      - ".github/workflows/pilot-proof-evidence-ci.yml"

permissions:
  contents: read

jobs:
  verify-pilot-proof-evidence:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify pilot proof metrics
        run: python scripts/verify_pilot_proof_metrics.py
