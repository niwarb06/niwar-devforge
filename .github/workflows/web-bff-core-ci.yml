name: Web BFF Core CI

on:
  push:
    paths:
      - "packages/web-bff-core/**"
      - ".github/workflows/web-bff-core-ci.yml"
  pull_request:
    paths:
      - "packages/web-bff-core/**"
      - ".github/workflows/web-bff-core-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web-bff-core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        env:
          npm_config_ignore_scripts: "true"
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
