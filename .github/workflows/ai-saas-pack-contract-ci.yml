name: AI SaaS Pack Contract CI

on:
  push:
    paths:
      - "packs/ai_saas/**"
      - ".github/workflows/ai-saas-pack-contract-ci.yml"
  pull_request:
    paths:
      - "packs/ai_saas/**"
      - ".github/workflows/ai-saas-pack-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-ai-saas-pack-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate AI SaaS pack contract
        run: python packs/ai_saas/validate_ai_saas_pack_contract.py
      - name: Run AI SaaS pack unit tests
        run: python -m unittest discover -s packs/ai_saas/tests -p "test_*.py"
