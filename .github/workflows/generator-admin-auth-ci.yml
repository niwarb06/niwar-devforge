name: Generator Admin Auth CI

on:
  push:
    paths:
      - "distribution/**"
      - "generator/**"
      - "packages/web-bff-core/**"
      - "packages/web-session-core/**"
      - ".github/workflows/generator-admin-auth-ci.yml"
  pull_request:
    paths:
      - "distribution/**"
      - "generator/**"
      - "packages/web-bff-core/**"
      - "packages/web-session-core/**"
      - ".github/workflows/generator-admin-auth-ci.yml"

permissions:
  contents: read

jobs:
  generated-admin-auth:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DEVFORGE_PRODUCT_PUBLIC_ORIGIN: https://admin.example.test
      DEVFORGE_PRODUCT_BACKEND_API_BASE_URL: https://api.example.test/api/v1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Generator unit tests
        run: node --test generator/tests/*.test.mjs

      - name: Build reusable web BFF core
        working-directory: packages/web-bff-core
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build reusable web session core
        working-directory: packages/web-session-core
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Generate Admin proof twice
        run: |
          rm -rf .generated/admin-first .generated/admin-second
          node generator/generate.mjs \
            --manifest generator/manifests/admin-auth-proof.json \
            --output .generated/admin-first
          node generator/generate.mjs \
            --manifest generator/manifests/admin-auth-proof.json \
            --output .generated/admin-second

      - name: Prove deterministic output
        run: diff -ru .generated/admin-first .generated/admin-second

      - name: Install generated Admin product
        working-directory: .generated/admin-first
        env:
          npm_config_ignore_scripts: "true"
        run: npm install --no-audit --no-fund

      - name: Run generated Admin test skeleton
        working-directory: .generated/admin-first
        run: npm test

      - name: Typecheck generated Admin product
        working-directory: .generated/admin-first
        run: npm run typecheck

      - name: Build generated Admin product
        working-directory: .generated/admin-first
        run: npm run build

      - name: Build versioned Web package bundle
        run: |
          set -euo pipefail
          rm -rf .package-bundle
          node distribution/build-auth-bundle.mjs .package-bundle
          test -f .package-bundle/web/bundle.json

      - name: Generate standalone Admin proof twice
        run: |
          set -euo pipefail
          rm -rf .generated/admin-standalone-first .generated/admin-standalone-second
          node generator/generate.mjs \
            --manifest generator/manifests/admin-auth-standalone-proof.json \
            --package-bundle .package-bundle/web \
            --output .generated/admin-standalone-first
          node generator/generate.mjs \
            --manifest generator/manifests/admin-auth-standalone-proof.json \
            --package-bundle .package-bundle/web \
            --output .generated/admin-standalone-second
          diff -ru .generated/admin-standalone-first .generated/admin-standalone-second

      - name: Prove standalone Admin dependency boundary
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings '../../packages/' .generated/admin-standalone-first
          ! grep -R --line-number --fixed-strings '../packages/' .generated/admin-standalone-first
          test -f .generated/admin-standalone-first/vendor/web-bff-core-0.1.0.tgz
          test -f .generated/admin-standalone-first/vendor/web-session-core-0.1.0.tgz
          node - <<'NODE'
          const fs = require('fs');
          const record = JSON.parse(fs.readFileSync('.generated/admin-standalone-first/.devforge-generation.json', 'utf8'));
          if (record.generator_version !== '0.4.0') throw new Error('wrong generator version');
          if (record.dependency_mode !== 'verified-vendored-bundle') throw new Error('standalone Admin is not vendored');
          for (const item of Object.values(record.vendored_packages || {})) {
            if (!item.destination.startsWith('vendor/')) throw new Error('unsafe vendored destination');
            if (!/^[0-9a-f]{64}$/.test(item.sha256)) throw new Error('invalid vendored digest');
          }
          NODE

      - name: Export standalone Admin into clean Git repository
        run: |
          set -euo pipefail
          rm -rf /tmp/devforge-standalone-admin
          cp -R .generated/admin-standalone-first /tmp/devforge-standalone-admin
          git -C /tmp/devforge-standalone-admin init -q
          git -C /tmp/devforge-standalone-admin config user.email ci@example.invalid
          git -C /tmp/devforge-standalone-admin config user.name DevForge-CI
          git -C /tmp/devforge-standalone-admin add .
          git -C /tmp/devforge-standalone-admin diff --cached --check
          rm -rf .package-bundle .generated/admin-standalone-first .generated/admin-standalone-second

      - name: Install and audit standalone Admin product
        working-directory: /tmp/devforge-standalone-admin
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

      - name: Run standalone Admin test skeleton
        working-directory: /tmp/devforge-standalone-admin
        run: npm test

      - name: Typecheck standalone Admin product
        working-directory: /tmp/devforge-standalone-admin
        run: npm run typecheck

      - name: Build standalone Admin product
        working-directory: /tmp/devforge-standalone-admin
        run: npm run build
