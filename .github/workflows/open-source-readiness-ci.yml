name: Open Source Readiness CI

on:
  push:
    paths:
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - "docs/**"
      - "packages/**"
      - "infrastructure/**"
      - "scripts/verify_open_source_readiness.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - "docs/**"
      - "packages/**"
      - "infrastructure/**"
      - "scripts/verify_open_source_readiness.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  repository-invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify public/open-source invariants
        run: python scripts/verify_open_source_readiness.py
