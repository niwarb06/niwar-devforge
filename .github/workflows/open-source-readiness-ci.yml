name: Open Source Readiness CI

on:
  push:
    paths:
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - "docs/**"
      - "packages/**"
      - "infrastructure/**"
      - "scripts/verify_open_source_readiness.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - "docs/**"
      - "packages/**"
      - "infrastructure/**"
      - "scripts/verify_open_source_readiness.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  repository-invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify public/open-source invariants
        run: python scripts/verify_open_source_readiness.py
