name: Next.js Browser Auth Pilot CI

on:
  push:
    paths:
      - "apps/web_next/**"
      - "packages/web-bff-core/**"
      - "packages/web-session-core/**"
      - ".github/workflows/web-next-pilot-ci.yml"
  pull_request:
    paths:
      - "apps/web_next/**"
      - "packages/web-bff-core/**"
      - "packages/web-session-core/**"
      - ".github/workflows/web-next-pilot-ci.yml"

permissions:
  contents: read

jobs:
  browser-auth-pilot:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build web BFF core
        working-directory: packages/web-bff-core
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build web session core
        working-directory: packages/web-session-core
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install pilot
        working-directory: apps/web_next
        env:
          npm_config_ignore_scripts: "true"
        run: npm install --no-audit --no-fund

      - name: Typecheck pilot
        working-directory: apps/web_next
        run: npm run typecheck

      - name: Build pilot
        working-directory: apps/web_next
        env:
          DEVFORGE_PILOT_PUBLIC_ORIGIN: "http://127.0.0.1:3000"
          DEVFORGE_PILOT_BACKEND_API_BASE_URL: "http://127.0.0.1:3000/api/pilot-backend/v1"
        run: npm run build

      - name: Install Chromium
        working-directory: apps/web_next
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        working-directory: apps/web_next
        env:
          DEVFORGE_PILOT_PUBLIC_ORIGIN: "http://127.0.0.1:3000"
        run: npm run test:e2e
