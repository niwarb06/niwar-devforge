name: Generator Web Auth CI

on:
  push:
    paths:
      - "generator/**"
      - "packages/backend-core/**"
      - "packages/web-bff-core/**"
      - "packages/web-session-core/**"
      - ".github/workflows/generator-web-auth-ci.yml"
  pull_request:
    paths:
      - "generator/**"
      - "packages/backend-core/**"
      - "packages/web-bff-core/**"
      - "packages/web-session-core/**"
      - ".github/workflows/generator-web-auth-ci.yml"

permissions:
  contents: read

jobs:
  generated-web-auth-build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devforge
          POSTGRES_USER: devforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devforge -d devforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: valkey/valkey:7.2.14-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DEVFORGE_ENVIRONMENT: test
      DEVFORGE_DATABASE_URL: postgresql+psycopg://devforge@127.0.0.1:5432/devforge
      DEVFORGE_REDIS_URL: redis://127.0.0.1:6379/0
      DEVFORGE_PRODUCT_PUBLIC_ORIGIN: http://127.0.0.1:3000
      DEVFORGE_PRODUCT_BACKEND_API_BASE_URL: http://127.0.0.1:8000/api/v1
      DEVFORGE_GENERATED_RUNTIME_ORIGIN: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generator unit tests
        run: node --test generator/tests/*.test.mjs

      - name: Build reusable web BFF core
        working-directory: packages/web-bff-core
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build reusable web session core
        working-directory: packages/web-session-core
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install real backend core
        working-directory: packages/backend-core
        run: pip install -e .

      - name: Apply backend migrations
        working-directory: packages/backend-core
        run: alembic upgrade head

      - name: Generate product twice
        run: |
          rm -rf .generated
          node generator/generate.mjs \
            --manifest generator/manifests/web-auth-proof.json \
            --output .generated/first
          node generator/generate.mjs \
            --manifest generator/manifests/web-auth-proof.json \
            --output .generated/second

      - name: Prove deterministic output
        run: diff -ru .generated/first .generated/second

      - name: Install generated product
        working-directory: .generated/first
        env:
          npm_config_ignore_scripts: "true"
        run: npm install --no-audit --no-fund

      - name: Typecheck generated product
        working-directory: .generated/first
        run: npm run typecheck

      - name: Build generated product
        working-directory: .generated/first
        run: npm run build

      - name: Install runtime Chromium harness
        working-directory: .generated/first
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start real backend and generated production server
        run: |
          nohup python -m uvicorn devforge_core.main:app --host 127.0.0.1 --port 8000 > .generated/backend.log 2>&1 &
          echo $! > .generated/backend.pid

          (
            cd .generated/first
            nohup npm run start > ../web.log 2>&1 &
            echo $! > ../web.pid
          )

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat .generated/backend.log
              exit 1
            fi
            sleep 1
          done

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat .generated/web.log
              exit 1
            fi
            sleep 1
          done

      - name: Generated product real-backend browser E2E
        working-directory: .generated/first
        run: node ../../generator/runtime/web-auth-e2e.mjs

      - name: Stop runtime servers
        if: always()
        run: |
          if [ -f .generated/web.pid ]; then kill "$(cat .generated/web.pid)" || true; fi
          if [ -f .generated/backend.pid ]; then kill "$(cat .generated/backend.pid)" || true; fi
