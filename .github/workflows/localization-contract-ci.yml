name: Localization Contract CI

on:
  push:
    paths:
      - "packages/localization/**"
      - ".github/workflows/localization-contract-ci.yml"
  pull_request:
    paths:
      - "packages/localization/**"
      - ".github/workflows/localization-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-localization-contract:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate localization contract
        run: python packages/localization/validate_locales.py

      - name: Run localization unit tests
        run: python -m unittest discover -s packages/localization/tests -p "test_*.py"
